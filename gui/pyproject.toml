[project]
name = "piperread-gui"
version = "0.1.0"
description = "Interface graphique de PiperRead — client du noyau read.sh, jamais un import direct du moteur Piper"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6",
    "requests",
    "pysbd",
    "sounddevice",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
piperread-gui-cli = "piperread_gui.cli:main"
piperread-gui = "piperread_gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["piperread_gui*"]
