[project]
name = "piperread-gui"
version = "0.3.1"
description = "Tray interface for PiperRead: drives the Piper engine as an external HTTP server, never imports it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6",
    "requests",
    "pysbd",
    "sounddevice",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
piperread-gui-cli = "piperread_gui.cli:main"
piperread-gui = "piperread_gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["piperread_gui*"]
